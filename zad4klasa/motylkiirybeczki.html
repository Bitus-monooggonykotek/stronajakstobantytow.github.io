<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Malowanki dla dzieci</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #eee;
}

.wrapper {
    width: 900px;
    margin: 20px auto;
    border: 2px solid #ccc;
    background-color: white;
}

header {
    background-color: red;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    display: flex;
}

nav {
    background-color: orange;
    width: 200px;
    padding: 20px;
}

nav ul {
    list-style-type: disc;
    color: yellow;
    padding-left: 20px;
}

nav li {
    margin: 10px 0;
    font-size: 18px;
}

main {
    background-color: #ddd0a8;
    flex: 1;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 20px;
}

main img {
    max-width: 200px;
    height: auto;
}
footer {
    background-color: #bdb6d8;
    padding: 10px;
    text-align: right;
    color: red;
}
</style>

</head>
<body>

<div class="wrapper">

<header>
    Malowanki dla dzieci
</header>

<div class="container">
    
    <nav>
        <ul>
            <li>Rybki</li>
            <li>Koty</li>
            <li>Owieczki</li>
            <li>Foki</li>
            <li>Motyle</li>
        </ul>
    </nav>

    <main>
        <!-- WSTAW TUTAJ OBRAZKI -->
        <img src="rybka.png" alt="Rybka">
        <img src="motylek.png" alt="Motyl">
    </main>

</div>

<footer>
    Adres e-mail: maluj@interia.pl
</footer>

</div>

</body>
</html>
