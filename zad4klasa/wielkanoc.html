<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Święta Wielkanocne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8dc;
            text-align: center;
        }

        h1 {
            color: #2e8b57;
        }

        .opis {
            font-size: 18px;
            margin: 20px;
        }

        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .galeria img {
            width: 200px;
            margin: 10px;
            border: 3px solid #2e8b57;
            border-radius: 10px;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            background-color: #2e8b57;
            color: white;
        }
    </style>
</head>
<body>

    <h1> Wesołych Świąt Wielkanocnych! </h1>

    <div class="opis">
        <p>
            wielkanoc fajne święto fajnie z rodzinkom posiedziec i fajny żur taki swiateczny upasiony Hej!
        </p>
    </div>

    <div class="galeria">
        <img src="jajko.png" alt="Jajko wielkanocne">
        <img src="zajac.png" alt="Zajączek">
        <img src="kwiaty.png" alt="Kwiaty">
        <img src="koszyk.png" alt="Koszyczek wielkanocny">
        <img src="baranek.png" alt="Baranek">
    </div>

    <footer>
        Witold Maślanka
    </footer>

</body>
</html>
