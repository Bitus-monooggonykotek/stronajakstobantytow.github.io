<html lang="pl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        
        .main-container {
            width: 600px;
            height: 600px;
            display: flex;
            flex-wrap: wrap;
            border: 2px solid #333;
        }
        

        .main-container > div {
            width: 25%;
            height: 25%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 5px;
        }
        

        .silver { 
            background-color: #C0C0C0; 
            color: #333;
        }
        .gray { 
            background-color: #808080; 
            color: white;
        }
        .maroon { 
            background-color: #800000; 
            color: white;
        }
        .green { 
            background-color: #008000; 
            color: white;
        }
        

        .white { 
            background-color: #FFFFFF; 
            border: 1px solid #ddd;
            color: #333;
        }
        .black { 
            background-color: #000000; 
            color: white;
        }
        .red { 
            background-color: #FF0000; 
            color: white;
        }
        .lime { 
            background-color: #00FF00; 
            color: #333;
        }
        

        .navy { 
            background-color: #000080; 
            color: white;
            border: 3px double #FF1493; 
        }
        .purple { 
            background-color: #800080; 
            color: white;
        }
        .olive { 
            background-color: #808000; 
            color: white;
        }
        .teal { 
            background-color: #008080; 
            color: white;
        }
        
        .blue { 
            background-color: #0000FF; 
            color: white;
        }
        .magenta { 
            background-color: #FF000F; 
            color: white;
        }
        .yellow { 
            background-color: #FFFF00; 
            color: #333;
        }
        .cyan { 
            background-color: #00FFFF; 
            color: #333;
        }
        
        .color-code {
            font-size: 11px;
            font-weight: normal;
            margin-top: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="silver">
            silver
            <div class="color-code">#C0C0C0</div>
        </div>
        <div class="gray">
            gray
            <div class="color-code">#808080</div>
        </div>
        <div class="maroon">
            maroon
            <div class="color-code">#800000</div>
        </div>
        <div class="green">
            green
            <div class="color-code">#008000</div>
        </div>
        
        <div class="white">
            white
            <div class="color-code">#FFFFFF</div>
        </div>
        <div class="black">
            black
            <div class="color-code">#000000</div>
        </div>
        <div class="red">
            red
            <div class="color-code">#FF0000</div>
        </div>
        <div class="lime">
            lime
            <div class="color-code">#00FF00</div>
        </div>
        
        <div class="navy">
            navy
            <div class="color-code">#000080</div>
        </div>
        <div class="purple">
            purple
            <div class="color-code">#800080</div>
        </div>
        <div class="olive">
            olive
            <div class="color-code">#808000</div>
        </div>
        <div class="teal">
            teal
            <div class="color-code">#008080</div>
        </div>
        
        <div class="blue">
            blue
            <div class="color-code">#0000FF</div>
        </div>
        <div class="magenta">
            magenta
            <div class="color-code">#FF000F</div>
        </div>
        <div class="yellow">
            yellow
            <div class="color-code">#FFFF00</div>
        </div>
        <div class="cyan">
            cyan
            <div class="color-code">#00FFFF</div>
        </div>
    </div>


</body></html>
